name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: 安装开发检查工具
        run: python -m pip install ruff
      - name: 代码规范
        run: ruff check .
      - name: Python 回归测试
        run: python -m unittest discover -s tests -v
      - name: 跨平台安装入口检查
        run: python scripts/bootstrap.py --help
      - name: Python 语法检查
        run: python -m compileall -q src run.py tests
      - name: 启动脚本语法检查
        run: bash -n "安装 MediaDistill.command" "启动 MediaDistill.command"

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Windows 回归测试
        run: python -m unittest discover -s tests -v
      - name: Windows 安装入口检查
        run: |
          $env:PYTHONIOENCODING = "cp1252"
          python scripts/bootstrap.py --help
      - name: Windows Python 语法检查
        run: python -W error -m compileall -f -q src scripts run.py tests
      - name: Windows 命令行入口检查
        run: |
          $env:PYTHONIOENCODING = "cp1252"
          python run.py --help
