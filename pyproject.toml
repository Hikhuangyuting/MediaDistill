[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "media-distill"
version = "0.1.0"
description = "Local-first audio and video knowledge distillation to Markdown"
readme = "README.md"
requires-python = ">=3.10"

dependencies = ["faster-whisper>=1.0.0"]

[project.optional-dependencies]
yaml = ["pyyaml>=6.0"]
dev = ["ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"run.py" = ["E402"]
"scripts/*.py" = ["E402"]
